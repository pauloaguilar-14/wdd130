<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="Contact Exciting Expeditions for questions, reservations, or suggestions about our whitewater rafting trips.">
    <meta name="author" content="Paulo Aguilar">

    <title>Contact Us | Exciting Expeditions</title>

    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <header>
        <img src="images/logo.jpg" alt="Exciting Expeditions Logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <section class="contact-info">
            <h1>White Water Rafting Company</h1>
            <p>123 Main River Street</p>
            <p>Kolob, California</p>
            <p>+51 983 578 455</p>
            <p>info@whitewater.com</p>
        </section>

        <section class="contact-details">
            <iframe
              src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3132.636350707731!2d-122.07412632365191!3d38.264739283784664!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x808516a58c6cbdd7%3A0xbce548206b7e0c73!2sKolob%20Dr%2C%20Fairfield%2C%20CA%2094534%2C%20EE.%20UU.!5e0!3m2!1ses-419!2spe!4v1785884126409!5m2!1ses-419!2spe"
              width="600" height="450" allowfullscreen="" loading="lazy"
              referrerpolicy="strict-origin-when-cross-origin">
            </iframe>
            <form>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <p>Message Purpose:</p>
                <label><input type="radio" name="purpose" value="general" checked> General
                    Inquiry</label>
                <label><input type="radio" name="purpose" value="reservation"> Reservation
                    Question</label>
                <label><input type="radio" name="purpose" value="suggestion"> Website
                    Suggestion</label>

                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="5" placeholder="Type here"></textarea>

                <label>
                    <input type="checkbox" id="newsletter" name="newsletter">
                    Please subscribe me to the monthly newsletter
                </label>

                <button type="submit">Get in Touch!</button>
            </form>
        </section>

        <section class="employees">
            <h2>We Are Here to Serve You</h2>
            <div class="employees-container">
                <figure>
                    <img src="images/employee1.jpg" alt="Head Guide">
                    <figcaption>Maria Lopez - Head Guide</figcaption>
                </figure>
                <figure>
                    <img src="images/employee2.jpg" alt="Safety Coordinator">
                    <figcaption>John Rivera - Safety Coordinator</figcaption>
                </figure>
                <figure>
                    <img src="images/employee3.jpg" alt="Operations Manager">
                    <figcaption>Ana Torres - Operations Manager</figcaption>
                </figure>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy;2026 | Exciting Expeditions | Paulo Aguilar</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.svg" alt="Facebook">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin.svg" alt="LinkedIn">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.svg" alt="Instagram">
            </a>
        </nav>
    </footer>

</body>

</html>
